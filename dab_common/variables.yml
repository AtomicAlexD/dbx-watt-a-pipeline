# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_suffix:
    description: The suffix to append to the catalog name
    default: _dev
  catalog_raw:
    description: The catalog to use for loading data into the raw layer
    default: raw${var.catalog_suffix}
  catalog_bronze:
    description: The catalog to use for loading data into the bronze layer
    default: bronze${var.catalog_suffix}
  catalog_silver:
    description: The catalog to use for loading data into the silver layer
    default: silver${var.catalog_suffix}
  catalog_gold:
    description: The catalog to use for loading data into the gold layer
    default: gold${var.catalog_suffix}
  warehouse_id:
    description: "SQL warehouse ID used by the turbine health app"
    default: <add a warehouse ID here>
  app_name:
    description: "Name of the turbine health Databricks App"