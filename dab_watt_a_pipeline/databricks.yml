# This is a Declarative Automation Bundle definition for dab_watt_a_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_watt_a_pipeline
include:
  - ../dab_common/*.yml
  - resources/*.yml

resources:
  schemas:
    raw_turbine_data:
      name: turbine_data
      catalog_name: ${var.catalog_raw}
      comment: Landing zone schema for raw turbine sensor data
    bronze_turbine_data:
      name: turbine_data
      catalog_name: ${var.catalog_bronze}
      comment: Bronze layer schema for ingested turbine data
    silver_turbine_data:
      name: turbine_data
      catalog_name: ${var.catalog_silver}
      comment: Silver layer schema for cleaned and imputed turbine data
    gold_turbine_data:
      name: turbine_data
      catalog_name: ${var.catalog_gold}
      comment: Gold layer schema for aggregated turbine data

  volumes:
    landing:
      name: landing
      catalog_name: ${var.catalog_raw}
      schema_name: ${resources.schemas.raw_turbine_data.name}
      comment: Managed volume for raw CSV landing files