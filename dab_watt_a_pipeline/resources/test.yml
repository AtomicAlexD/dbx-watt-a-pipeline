resources:
  pipelines:
    turbine_bronze:
      name: turbine_bronze_ingest
      catalog: ${var.catalog_bronze}
      schema: ${resources.schemas.bronze_turbine_data.name}
      serverless: true
      configuration:
        turbine_pipeline.landing_volume_path: /Volumes/${var.catalog_raw}/${resources.schemas.raw_turbine_data.name}/landing
      libraries:
        - file:
            path: ../src/turbine_data/extract_raw.py